# Render.com blueprint for the ProctorVision backend.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In Render: New → Blueprint → connect your GitHub repo.
#
# Both frontend and backend are served from this single service:
# FastAPI handles API routes + WebSockets, and falls back to the
# built React SPA for everything else.

services:
  - type: web
    name: proctorvision
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install --no-cache-dir -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://proctorvision_user:C31YjAJOJr1v0uKqAhMRTaUvJMMk9Ehe@dpg-d82u1p0js32c7384rl80-a/proctorvision
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Prevent Ultralytics from trying to write config to a read-only path
      - key: YOLO_CONFIG_DIR
        value: /tmp/ultralytics
      - key: ULTRALYTICS_DIR
        value: /tmp/ultralytics
