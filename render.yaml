# Render.com blueprint for the ProctorVision backend.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In Render: New → Blueprint → connect your GitHub repo.
#   3. Render reads this file and provisions everything below.
#
# What this creates:
#   - One web service (FastAPI + uvicorn + ML stack)
#   - One persistent disk mounted at /var/data for the SQLite file
#     and any future evidence-snapshot exports
#
# Both frontend and backend are served from this single service:
# FastAPI handles API routes + WebSockets, and falls back to the
# built React SPA for everything else (thanks to StaticFiles html=True).

services:
  - type: web
    name: proctorvision
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    # Build frontend first (Render has Node available), then backend.
    # The resulting frontend/dist is served by FastAPI as static files.
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install --no-cache-dir -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/proctorvision.db
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Prevent Ultralytics from trying to write config to a read-only path
      - key: YOLO_CONFIG_DIR
        value: /tmp/ultralytics
      - key: ULTRALYTICS_DIR
        value: /tmp/ultralytics
    disk:
      name: proctorvision-data
      mountPath: /var/data
      sizeGB: 1
